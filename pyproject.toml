[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pydigest2"
version = "0.1.0"
description = "Pure-Python port of digest2: NEO orbit classification from short-arc astrometric tracklets"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Public Domain" }
authors = [{ name = "PyDigest2 contributors" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: Public Domain",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = ["numpy"]

[project.optional-dependencies]
# Optional JIT accelerator: ~30x faster scoring, and lets batches
# parallelize with threads instead of processes. Never required --
# without it the same kernel runs interpreted. See README.
fast = ["numba"]
test = ["pytest", "numpy"]
all = ["numba", "pytest"]

[project.scripts]
pydigest2 = "pydigest2.cli:main"

[tool.setuptools.packages.find]
include = ["pydigest2*"]

[tool.setuptools.package-data]
pydigest2 = ["data/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
